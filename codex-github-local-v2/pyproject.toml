[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-github-local-v2"
version = "0.2.1"
description = "Account-wide GitHub Issue execution with local chats, model collaboration and draft PR delivery"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-github-local-v2 = "codex_github_local_v2.mvp2:main"
codex-github-local-v2-mvp2 = "codex_github_local_v2.mvp2:main"
codex-github-local-v2-model-api = "codex_github_local_v2.collaboration_api:main"
codex-github-local-v2-workbench = "codex_github_local_v2.workbench:main"

[tool.setuptools.packages.find]
where = ["src"]
