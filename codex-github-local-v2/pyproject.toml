[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-github-local-v2"
version = "0.0.3"
description = "Side-by-side prototype for a policy-first ChatGPT to Codex local orchestrator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-github-local-v2 = "codex_github_local_v2.cli:main"
codex-github-local-v2-control = "codex_github_local_v2.remote_control:main"

[tool.setuptools.packages.find]
where = ["src"]
