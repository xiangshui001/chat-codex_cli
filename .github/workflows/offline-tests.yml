name: Offline regression tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'codex-github-local/**'
      - '.github/workflows/offline-tests.yml'
  pull_request:
    paths:
      - 'codex-github-local/**'
      - '.github/workflows/offline-tests.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run fake-model and fake-GitHub tests
        run: python3 codex-github-local/verify.py
      - name: Require all POSIX tests to execute
        run: python3 -c 'import json; r=json.load(open("codex-github-local/validation/posix-offline-summary.json")); assert r["passed"] and r["tests_executed"] == 53 and r["skipped"] == 0, r'
