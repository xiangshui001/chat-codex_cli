name: v2 prototype tests

on:
  push:
    branches:
      - prototype/orchestrator-v2
      - integration/**
      - feature/v2-mvp0-issue-to-codex
    paths:
      - 'codex-github-local-v2/**'
      - 'docs/V2架构草案.md'
      - '.github/workflows/v2-prototype-tests.yml'
  pull_request:
    paths:
      - 'codex-github-local-v2/**'
      - 'docs/V2架构草案.md'
      - '.github/workflows/v2-prototype-tests.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run v2 unit tests
        run: python3 -m unittest discover -s codex-github-local-v2/tests -v
      - name: Check unchanged V1 offline regression
        run: |
          python3 codex-github-local/verify.py
          python3 -c 'import json; r=json.load(open("codex-github-local/validation/posix-offline-summary.json")); assert r["passed"] and r["tests_executed"] == 53 and r["skipped"] == 0, r'
      - name: Validate public examples
        run: |
          PYTHONPATH=codex-github-local-v2/src python3 -m codex_github_local_v2.cli validate codex-github-local-v2/examples/audit-readonly.json
      - name: Build and smoke-test installed entrypoints
        run: |
          python3 -m pip wheel --no-deps ./codex-github-local-v2 --wheel-dir "$RUNNER_TEMP/v2-wheels"
          python3 -m venv "$RUNNER_TEMP/v2-install"
          "$RUNNER_TEMP/v2-install/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/v2-wheels" codex-github-local-v2
          export V2_EXAMPLE="$GITHUB_WORKSPACE/codex-github-local-v2/examples/audit-readonly.json"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/v2-install/bin/codex-github-local-v2" --help
          "$RUNNER_TEMP/v2-install/bin/codex-github-local-v2" validate "$V2_EXAMPLE"
          "$RUNNER_TEMP/v2-install/bin/codex-github-local-v2-control" --help
          "$RUNNER_TEMP/v2-install/bin/codex-github-local-v2-mvp0" --help
