name: v2 prototype tests

on:
  push:
    branches:
      - prototype/orchestrator-v2
    paths:
      - 'codex-github-local-v2/**'
      - 'docs/V2架构草案.md'
      - '.github/workflows/v2-prototype-tests.yml'
  pull_request:
    paths:
      - 'codex-github-local-v2/**'
      - 'docs/V2架构草案.md'
      - '.github/workflows/v2-prototype-tests.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run v2 unit tests
        run: python3 -m unittest discover -s codex-github-local-v2/tests -v
      - name: Validate public examples
        run: |
          PYTHONPATH=codex-github-local-v2/src python3 -m codex_github_local_v2.cli validate codex-github-local-v2/examples/audit-readonly.json
