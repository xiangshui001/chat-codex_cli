 `<div class="detail-columns"><div class="stack">${panel('任务合同',`<div class="section"><h3>目标</h3><p>${E(t.raw.goal)}</p></div><div class="section"><h3>Read scope <span class="small muted">允许读取</span></h3><div class="scope">${t.raw.read_scope.map(p=>`<code>${E(p)}</code>`).join('')}</div><h3 style="margin-top:18px">Write scope <span class="small muted">允许候选 diff</span></h3><div class="scope write">${t.raw.write_scope.map(p=>`<code>${E(p)}</code>`).join('')}</div><p class="small muted" style="margin-top:12px">任务范围仍受 Host policy 与 protected paths 限制。</p></div><div class="section"><div class="two-col"><div><h3>预算</h3><p>最多 2 轮 / 45 分钟</p></div><div><h3>发布策略</h3><p>Draft PR · 人工合并</p></div></div></div>`)}
 ${panel('检查与独立审阅',`<div class="section"><div class="row between"><h3>Validation</h3><span class="pill ${t.checks.status==='unavailable'?'amber':t.checks.status==='pass'?'green':''}">${E(t.checks.status)}</span></div><p>${E(t.checks.summary)}</p></div><div class="section"><div class="row between"><h3>Reviewer</h3><span class="pill ${t.review.verdict==='pass'?'green':''}">${E(t.review.verdict)}</span></div><p>${E(t.review.summary)}</p></div>`)}</div><div class="stack">${panel('状态轨迹',`<div class="timeline">${t.events.map(ev=>`<div class="event"><div class="row between"><span>${E(stateMeta[ev.state]?.[0] || ev.state)}</span><span class="time mono">${E(ev.at)}</span></div><div class="small">${E(ev.detail)}</div></div>`).join('')}</div><div class="subnote">设计用的简化轨迹；真实接口应标明是否完整。</div>`,icon('tasks'))}
 ${panel('领取时的证据',evidenceBox(t,true),`<button type="button" class="button sm" data-action="evidence" data-id="${E(t.id)}">全部 ${icon('chevron')}</button>`)}
 ${t.pinned?'<div class="alert">'+icon('lock')+'此任务显式固定 Executor；未来默认值也不会覆盖它。</div>':''}</div></div>`;
}
function evidenceView(){
 const t=task();
 return head('evidence','查看合同、领取快照与允许公开的证据；原始模型日志不进入页面。')+`<div class="toolbar"><label for="evidence-task" class="small secondary">选择任务</label><select id="evidence-task" class="filter-select">${tasks.map(x=>`<option value="${E(x.id)}" ${x.id===t.id?'selected':''}>${E(x.id)} · ${E(x.title)}</option>`).join('')}</select><span class="spacer"></span><button type="button" class="button outline sm" data-action="task" data-id="${E(t.id)}">任务详情 ${icon('chevron')}</button></div><div class="evidence-layout"><section class="panel"><div class="panel-head"><h2>Evidence files</h2><span class="tag">MOCK</span></div><div class="file-list">${evidenceNames.map(n=>`<button type="button" class="file-row ${state.artifact===n?'selected':''}" data-action="artifact" data-name="${n}">${icon('evidence')}<div><p class="mono">${E(n)}</p><div class="small">${n.startsWith('reviewer')?'结果占位 / 脱敏投影':'设计数据'}</div></div></button>`).join('')}</div></section>${panel(state.artifact,evidenceBox(t),`<span class="pill">${E(t.id)}</span>`)}</div><div class="alert" style="margin-top:20px">${icon('info')}真实 API 按任务权限和白名单文件名提供脱敏投影。不可直接公开整个 runtime 目录。</div>`;
}
function reviews(){
 const subset=tasks.filter(t=>['pr_open','accepted'].includes(t.state));
 return head('reviews','汇总 PR 和验证证据，保留最后的人工决定。')+`<div class="review-grid">${subset.map(t=>`<section class="panel"><div class="panel-head"><h2>${E(t.pr)}</h2><span class="pill ${t.state==='accepted'?'green':'amber'}">${t.state==='accepted'?'模拟已接纳':'等待人工审阅'}</span></div><div class="panel-pad"><div class="small mono muted">${E(t.id)}</div><h3 style="margin-top:7px">${E(t.title)}</h3><div class="kv" style="margin-top:16px"><span class="muted">Checks</span><span class="pill ${t.checks.status==='unavailable'?'amber':'green'}">${E(t.checks.status)}</span></div><p class="small secondary">${E(t.checks.summary)}</p><div class="kv"><span class="muted">Independent review</span><span class="pill green">${E(t.review.verdict)}</span></div><div class="row between" style="border-top:1px solid var(--line);padding-top:15px;margin-top:16px"><span class="small muted">设计预览 · 不触发合并</span><button type="button" class="button outline sm" data-action="task" data-id="${E(t.id)}">查看任务证据</button></div></div></section>`).join('')}</div>`;
}
function members(){
 return head('members','先定义协作边界；真实权限由服务端会话和仓库授权决定。')+`<div class="alert">${icon('info')}顶栏下拉框只是角色预览，没有登录、邀请或权限授予效果。</div><section class="panel"><div class="table-scroll"><table class="permission-table"><thead><tr><th>角色</th><th>任务 / 主机 / 证据 / PR</th><th>模型与队列</th><th>成员管理入口</th></tr></thead><tbody>${Object.entries(roles).map(([r,label])=>`<tr><td><strong>${E(label)}</strong>${r===state.role?'<span class="pill blue" style="margin-left:8px">当前预览</span>':''}</td><td>按仓库授权可查看</td><td>${['owner','operator'].includes(r)?'可提交控制':'只读'}</td><td>${['owner','operator'].includes(r)?'可查看':'无入口'}</td></tr>`).join('')}</tbody></table></div></section><div class="two-col" style="margin-top:20px">${panel('前端职责','<div class="panel-pad"><p class="small secondary">读取 capabilities 隐藏受限路由并禁用写操作，帮助用户理解可执行的动作。</p></div>')}${panel('服务端职责','<div class="panel-pad"><p class="small secondary">逐次校验身份、仓库权限与证据权限；不能信任浏览器提交的角色字段。</p></div>')}</div>`;
}
const renderers={dashboard, tasks:()=>location.hash.includes('/')?taskDetail():taskList(),models,hosts:hostView,evidence:evidenceView,reviews,members};
function render(){
 const route=routes[state.view];
 const allowed=!route.allowed||route.allowed.includes(state.role);
 document.title=(allowed?route.title:'无访问权限')+' · chat-codex 设计预览';
 const content=allowed?renderers[state.view]():head('members','当前角色预览无成员管理入口。')+'<div class="alert amber">'+icon('lock')+'权限受限 · 这仅演示 route guard，真实 API 仍需服务端授权。</div>';
 document.getElementById('app').innerHTML=`<div class="shell"><button type="button" class="scrim" data-action="menu" aria-label="关闭导航"></button><aside class="sidebar" aria-label="主导航"><div class="brand"><span class="brandmark">&lt;/&gt;</span><span class="brandname">chat-codex<span>v2</span></span></div><div class="project"><div class="small">PROJECT / MOCK</div><div class="project-name">demo / codex-workbench</div><div class="small" style="letter-spacing:0;text-transform:none;margin-top:3px">管理前端适配设计</div></div><div class="navlabel">工作区</div><nav>${Object.keys(routes).slice(0,5).map(navButton).join('')}</nav><div class="navlabel" style="margin-top:23px">协作</div><nav>${navButton('reviews')}${['owner','operator'].includes(state.role)?navButton('members'):''}</nav><div class="sidebar-control"><div class="row between"><span class="small secondary">新任务领取</span><span class="pill ${runtime.paused?'amber':'green'}"><i class="dot"></i>${runtime.paused?'暂停':'可领取'}</span></div><button type="button" class="button outline" data-action="queue" style="width:100%;margin-top:10px" ${!canControl()||state.pending?'disabled':''}>${icon(runtime.paused?'play':'pause')}${runtime.paused?'恢复领取':'暂停新任务'}</button><p class="small muted" style="font-size:10px;margin-top:8px">当前任务继续执行</p></div><div class="sidebar-foot"><div class="row between"><span class="small secondary">界面外观</span><button type="button" class="button icon sm" data-action="theme" aria-label="切换亮暗主题">${icon('sun')}</button></div><p class="hint">DSH UI adaptation · design 01</p></div></aside><div class="main"><header class="topbar"><button type="button" class="button icon mobile-toggle" data-action="menu" aria-label="打开导航">${icon('menu')}</button><div class="breadcrumb"><span class="desktop">Workspace</span><span class="desktop">${icon('chevron')}</span><span>${E(route.title)}</span></div><span class="tag preview">设计预览</span><div class="topright"><button type="button" class="global-search" data-action="search" aria-label="搜索任务">${icon('search')}<span>搜索任务</span><span class="badge-key">⌘ K</span></button><span class="pill blue status-chip">Mock data</span><div class="role-box"><div class="role-caption">角色预览 · 无认证</div><select id="role-select" class="role-select" aria-label="角色预览">${Object.entries(roles).map(([k,v])=>`<option value="${k}" ${state.role===k?'selected':''}>${E(v)}</option>`).join('')}</select></div><span class="avatar">${E(state.role.slice(0,1).toUpperCase())}</span></div></header><main class="content" id="main-content" tabindex="-1">${content}${state.view!=='models'?notice():''}<footer class="footer"><span>全部为模拟数据 · 刷新重置 · 未连接 GitHub / Codex Host</span><div class="row"><a href="DSH_ADAPTATION.md">适配方案</a><a href="NOTICE.md">DSH attribution</a><span>design-01</span></div></footer></main></div></div>`;
}
function navigate(to){document.body.classList.remove('sidebar-open');if(location.hash==='#'+to){readRoute();}else location.hash=to;}
function readRoute(){const [key,id]=location.hash.slice(1).split('/');state.view=routes[key]?key:'dashboard';if(id&&tasks.some(t=>t.id===id)){state.taskId=id;}render();if(state.focusSearch&&state.view==='tasks'){document.getElementById('task-search')?.focus();state.focusSearch=false;}}
async function command(method,args){
 if(!canControl()||state.pending)return;
 state.pending=true;state.notice={outcome:'pending',message:'正在等待模拟控制回执…'};render();
 try{const receipt=await api[method](args);state.notice=receipt;await api.getRuntimeStatus();}
 catch(error){state.notice={outcome:'unknown',message:'模拟控制结果未知；真实接口应按 request_id 查询回执。'};}
 finally{state.pending=false;render();}
}
const actions={
 navigate:el=>navigate(el.dataset.to),
 task:el=>{state.artifact='task.resolved.json';navigate('tasks/'+el.dataset.id);},
 evidence:el=>navigate('evidence/'+el.dataset.id),
 artifact:el=>{state.artifact=el.dataset.name;render();},
 filter:el=>{state.filter=el.dataset.filter;state.query='';navigate('tasks');},
 queue:()=>command(runtime.paused?'resumeQueue':'pauseQueue'),
 theme:()=>{document.body.classList.toggle('dark');},
 menu:()=>document.body.classList.toggle('sidebar-open'),
 search:()=>{state.filter='all';state.focusSearch=true;navigate('tasks');}
};
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el&&!el.disabled)actions[el.dataset.action]?.(el);});
document.addEventListener('submit',event=>{
 const form=event.target.closest('[data-form="model"]');if(!form)return;event.preventDefault();if(!canControl()||state.pending)return;
 const role=form.dataset.role;
 const model=form.elements.model.value.trim();const effort=form.elements.effort.value;
 if(!model){form.elements.model.focus();return;}
 state.models[role]={model,effort};
 command('setDefaultModel',{role,model,effort,reason:'design preview'});
});
document.addEventListener('input',event=>{
 if(event.target.id==='task-search'){state.query=event.target.value;const pos=event.target.selectionStart;render();const input=document.getElementById('task-search');input.focus();if(input.type!=='search')input.setSelectionRange(pos,pos);}
 const form=event.target.closest('[data-form="model"]');if(form&&event.target.name==='model')state.models[form.dataset.role].model=event.target.value;
});
document.addEventListener('change',event=>{
 const changes={
 'task-filter':()=>{state.filter=event.target.value;render();},
 'role-select':()=>{state.role=event.target.value;render();},
 'evidence-task':()=>navigate('evidence/'+event.target.value)
 };
 changes[event.target.id]?.();
 const form=event.target.closest('[data-form="model"]');if(form&&event.target.name==='effort')state.models[form.dataset.role].effort=event.target.value;
});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();actions.search();}if(event.key==='Escape')document.body.classList.remove('sidebar-open');});
window.addEventListener('hashchange',readRoute);
readRoute();
</script>
</body>
</html>
